 return s;
}
function roadPanelHtml(v){return '<div class="sectionline"><h2>BẢNG KHỐI · '+v.b.rounds.length+' VÁN</h2><span class="pill">Ván #'+v.n+'</span></div>'+roadHtml(v.b,Math.max(7,colOf(v.n)))+'<div class="note">Mỗi cột 6 hàng; Hòa vẫn chiếm một vị trí. T = ô hiện tại trùng ô mốc ở cột trước; N = khác; ? = thiếu hoặc Hòa. Với hàng 1–6, ô mốc ở hàng 3,4,1,2,3,4 của cột trước.</div><div class="subheading">12 VÁN GẦN NHẤT</div>'+rowShort(v.b)+'<div class="subheading">QUY TẮC SO T/N</div><div class="scrolltbl"><table><thead><tr><th>Hàng mới</th><th>Ô mốc cột trước</th></tr></thead><tbody>'+Array.from({length:6},(_,i)=>'<tr><td>Con '+(i+1)+'</td><td>Hàng '+REF[i+1]+'</td></tr>').join('')+'</tbody></table></div>';
}
function settingsHtml(v){let s='<div class="sectionline"><h2>BẬT/TẮT RULE BÁO THỬ</h2><span class="pill">13 rule</span></div><div class="callout">9 rule T/G đạt ≥70% trên những mẫu hồi cứu dùng để chọn chúng, nhưng chưa được kiểm định độc lập. Bốn rule cũ mặc định chỉ theo dõi. Bật/tắt không xóa lịch sử từng rule.</div>';
 for(const [name,group] of [['ỨNG VIÊN T/G · 9 RULE',RULES.filter(r=>PRIORITY_IDS.has(r.id))],['RULE CŨ THAM KHẢO · 4 RULE',RULES.filter(r=>!PRIORITY_IDS.has(r.id))]]){
 s+='<div class="rulegroup-title">'+name+'</div>';
 for(const r of group){const m=metricsFor(r.id);s+='<label class="togglelabel"><input type="checkbox" data-rule-toggle="'+r.id+'" '+(app.enabled[r.id]?'checked':'')+'><div class="desc"><b>'+r.id+'</b> <small>'+fmtPct(tripPct(m.total))+' · '+m.total.join('/')+' (Đ/S/H) · '+escapeHtml(r.description)+'</small></div></label>';}
 }
 s+='<div class="subheading">QUẢN LÝ BÀN</div><div class="fields"><button class="btn" id="renameBoard">Đổi tên bàn</button><button class="btn" id="setStart">Đặt ván bắt đầu</button><button class="btn danger" id="clearBoard">Xóa ván bàn này</button><button class="btn danger" id="deleteBoard">Xóa bàn hiện tại</button></div>';
 s+='<div class="subheading">SAO LƯU / NHẬP JSON</div><div class="fields"><button class="btn" id="exportJson">↓ Xuất JSON</button><button class="btn" id="importJson">↑ Nhập JSON</button></div><input id="jsonFile" type="file" accept=".json,application/json" class="hidden"><div class="note">V13 tự nhận các bàn lưu ở phiên bản cũ trên cùng trình duyệt trong lần mở đầu. Vẫn giữ bản lưu của V8/V9 riêng. Các lượt cũ không bị biến thành dự báo V13.</div>';
 s+='<div class="subheading">NGUỒN THỐNG KÊ</div><div class="note">744 ván lịch sử (17 chuỗi); 452 ván sao lưu (10 bàn sau lọc trùng, gồm 63 ván mới nhất). Mỗi rule có công thức được kiểm tra khớp lại với dữ liệu. 13 rule vẫn chỉ là ứng viên nghiên cứu, không bảo đảm kết quả ván sau.</div>';
 return s;}
function initHeader(v){el('roundTag').textContent='Ván #'+v.n;el('boardSelect').innerHTML=app.boards.map(b=>'<option value="'+escapeHtml(b.id)+'">'+escapeHtml(b.name)+' · '+b.rounds.length+' ván</option>').join('');el('boardSelect').value=app.currentId;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===app.tab));}
function render(){const v=currentModel();initHeader(v);for(const t of ['entry','signals','stats','road','settings']){const p=el('view-'+t);p.classList.toggle('active',app.tab===t);if(app.tab!==t)continue;p.innerHTML='<section class="panel">'+(t==='entry'?entryHtml(v):t==='signals'?signalsHtml(v):t==='stats'?statsHtml(v):t==='road'?roadPanelHtml(v):settingsHtml(v))+'</section>';}
 document.querySelectorAll('.roadwrap').forEach(e=>{e.scrollLeft=e.scrollWidth});}
function addBoard(){const name=prompt('Tên bàn mới:', 'Bàn '+(app.boards.length+1));if(name===null)return;const b=emptyBoard(name.trim()||'Bàn mới');app.boards.push(b);app.currentId=b.id;app.tab='entry';persist();render();}
function renameBoard(){const b=board(),name=prompt('Tên bàn:',b.name);if(name===null||!name.trim())return;b.name=name.trim().slice(0,70);persist();render();}
function startAt(){const b=board();if(b.rounds.length){toast('Chỉ đặt lại số bắt đầu khi bàn trống.');return;}const s=prompt('Bắt đầu ở ván số mấy?',String(b.start));if(s===null)return;const n=Number(s);if(!Number.isSafeInteger(n)||n<1){toast('Số ván không hợp lệ');return;}b.start=n;persist();render();}
function clearBoard(){const b=board();if(!confirm('Xóa toàn bộ ván và nhật ký của bàn '+b.name+'?'))return;b.rounds=[];b.logs=[];persist();render();}
function deleteBoard(){if(app.boards.length<=1){toast('Cần giữ ít nhất một bàn');return;}if(!confirm('Xóa bàn '+board().name+'?'))return;app.boards=app.boards.filter(b=>b.id!==app.currentId);app.currentId=app.boards[0].id;persist();render();}
function download(name,obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportJson(){download('13_TN_SaoLuu_'+new Date().toISOString().slice(0,10)+'.json',{format:'baccarat-tn-multitab',version:13,exportedAt:new Date().toISOString(),boards:app.boards,enabled:app.enabled,currentId:app.currentId});}
function absorbBoard(b){const old=app.boards.find(x=>x.id===b.id);
 if(old){const a=old.rounds,now=b.rounds;const overlap=Math.min(a.length,now.length);const samePrefix=a.slice(0,overlap).every((r,i)=>r.n===now[i].n&&r.v===now[i].v);
  if(samePrefix){if(now.length>a.length){old.rounds=now;old.logs=b.logs;old.start=b.start;}return false;}
  b.id=emptyBoard().id;
 }
 if(app.boards.some(x=>x.start===b.start&&x.rounds.length===b.rounds.length&&x.rounds.length>0&&x.rounds.every((r,i)=>r.n===b.rounds[i].n&&r.v===b.rounds[i].v)))return false;
 app.boards.push(b);return true;
}
async function importJson(file){try{const data=JSON.parse(await file.text());if(!Array.isArray(data.boards))throw new Error('JSON không có danh sách boards');const bs=validateBoards(data.boards).filter(b=>b.rounds.length);if(!bs.length)throw new Error('Không có ván hợp lệ');if(!confirm('Nhập '+bs.length+' bàn? Tool tự gộp bản cùng ID, không nhập trùng ván.'))return;
 let count=0;for(const b of bs)if(absorbBoard(b))count++;if(data.version===13&&data.enabled&&typeof data.enabled==='object')app.enabled={...app.enabled,...data.enabled};app.currentId=bs[0].id&&app.boards.find(x=>x.id===bs[0].id)?bs[0].id:app.boards.at(-1).id;app.tab='entry';persist();render();toast('Đã xử lý '+bs.length+' bàn, thêm '+count+' bàn mới');
 }catch(e){toast('Lỗi nhập: '+e.message);}}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;
 if(btn.dataset.result){addResult(btn.dataset.result);return;}if(btn.dataset.tab){switchTab(btn.dataset.tab);return;}
 const id=btn.id;
 if(id==='addBoard')addBoard();else if(id==='undo')undo();else if(id==='changeScope'){app.statsScope=app.statsScope==='all'?'board':'all';persist();render();}else if(id==='renameBoard')renameBoard();else if(id==='setStart')startAt();else if(id==='clearBoard')clearBoard();else if(id==='deleteBoard')deleteBoard();else if(id==='exportJson')exportJson();else if(id==='importJson')el('jsonFile').click();
});
document.addEventListener('change',e=>{const input=e.target;if(input.id==='boardSelect'){app.currentId=input.value;persist();render();}
 else if(input.dataset.ruleToggle){app.enabled[input.dataset.ruleToggle]=input.checked;persist();render();toast(input.dataset.ruleToggle+(input.checked?' bật báo thử':' chỉ theo dõi'));}
 else if(input.id==='jsonFile'){const f=input.files[0];if(f)importJson(f);input.value='';}
});
if(loaded.migrated){persist();}render();
</script></body></html>
